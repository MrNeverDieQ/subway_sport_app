# 仅做构建检查：核心资产（audio/、video/、data/training_blocks.py）不在仓库里，
# 这里用占位数据代替，产出的 APK 能安装启动但没有真实训练内容。
# 可用的正式包在私有资产仓库 subway_sport_assets 的 Actions 里打（工作流模板 tools/assets_repo/build_apk.yml，
# 资产用 tools/push_assets.py 同步过去），或在本机用 Dockerfile / buildozer 打。
name: Build APK (CI check)

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Guard - core assets must not be committed
        run: |
          leaked=0
          for p in data/training_blocks.py audio video; do
            if [ -e "$p" ]; then
              echo "::error::核心资产 $p 出现在仓库中，请按 AGENT_NOTES.md 用 git rm --cached 移除并清理历史"
              leaked=1
            fi
          done
          [ "$leaked" -eq 0 ]

      - name: Create stub training data (CI only)
        run: |
          mkdir -p audio video
          cat > data/training_blocks.py <<'PY'
          # CI 占位数据：只为验证 APK 能构建、安装、启动，不含真实训练内容。
          _P = {"name": "占位动作", "duration": 10, "sets": 1, "rest": 5,
                "cues": ["CI 占位数据，非真实训练内容"]}
          TRAINING_BLOCKS = {
              name: {"circuit_sets": 1, "warmup": [], "exercises": [dict(_P)], "cooldown": []}
              for name in [
                  "颈部强化训练", "臀腿隐形激活训练", "背部全域静态对抗训练",
                  "胸部全域静态对抗训练", "呼吸核心联动训练",
              ]
          }
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf libtool \
            libffi-dev libssl-dev libsqlite3-dev \
            python3-pip ccache
          # buildozer 固定 1.5.0：和 buildozer.spec 里 p4a.commit=v2024.01.21 配套（2026-03 验证过的组合）；
          # cython 必须 0.29.x：p4a v2024.01.21 的 ffpyplayer 配方是 v4.3.2，用宿主 Cython 直接编译，Cython 3 的 noexcept 语义会让它报
          # "Exception values are incompatible"（2026-11-26 run#2 实测）。0.29.33 是 buildozer 文档推荐版本，Kivy 2.3.0 支持 0.29.1+。
          # buildozer.spec 变化会使 ~/.buildozer 缓存失效、重下 SDK/NDK。
          pip install "buildozer==1.5.0" "cython==0.29.33"

      - name: Cache buildozer global
        uses: actions/cache@v5
        with:
          path: ~/.buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-

      - name: Accept Android SDK licenses and install build-tools
        run: |
          SDKMANAGER=$(find ~/.buildozer -name sdkmanager 2>/dev/null | head -1)
          if [ -n "$SDKMANAGER" ]; then
            yes 2>/dev/null | "$SDKMANAGER" --licenses || true
            "$SDKMANAGER" "build-tools;34.0.0" "platforms;android-33" || true
          fi

      - name: Build APK
        env:
          BUILDOZER_WARN_ON_ROOT: 0
        run: |
          set -o pipefail
          yes | buildozer android debug 2>&1 | tee build.log
          grep -E "^(Error|Traceback|# Build)" build.log || true

      - name: Upload APK (stub content, not for use)
        uses: actions/upload-artifact@v4
        with:
          name: subway-sport-apk-ci-stub
          path: bin/*.apk
          if-no-files-found: error
