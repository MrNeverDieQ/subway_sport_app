# 正式 APK 构建 —— 这个文件放在【私有资产仓库】subway_sport_assets 里运行。
#
# 公开仓库 subway_sport_app 只有代码；audio/、video/、data/training_blocks.py 只在私有仓库。
# 流程：checkout 公开仓库指定分支 → 把本仓库的资产覆盖进去 → buildozer android debug → 上传 APK
#       （artifact 在私有仓库里，只有仓库成员能下载）。
# 模板在公开仓库 tools/assets_repo/build_apk.yml，由 tools/push_assets.py 同步过来；要改请改模板。
name: Build APK

on:
  workflow_dispatch:
    inputs:
      code_ref:
        description: '公开仓库 subway_sport_app 的分支 / tag / commit'
        default: 'voice-guide-checkpoint'
        required: true
      archs:
        description: 'CPU 架构。armeabi-v7a 只有 2017 年前的老手机需要，加上会让构建时间翻倍'
        type: choice
        default: 'arm64-v8a'
        options:
          - 'arm64-v8a'
          - 'arm64-v8a, armeabi-v7a'

permissions:
  contents: write        # 首次运行把生成的 debug.keystore 提交回本仓库

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 150

    steps:
      - name: Checkout app code (public repo)
        uses: actions/checkout@v4
        with:
          repository: MrNeverDieQ/subway_sport_app
          ref: ${{ inputs.code_ref }}

      - name: Checkout assets (this repo)
        uses: actions/checkout@v4
        with:
          path: _assets

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 每台 CI 机器的调试签名都是现生成的，签名不同手机就不让"覆盖安装"，只能先卸载。
      # 所以把 debug.keystore 固定下来存在私有仓库里：第一次运行生成并提交，之后一直复用。
      - name: Stable debug keystore
        run: |
          set -e
          mkdir -p ~/.android
          if [ -f _assets/debug.keystore ]; then
            cp _assets/debug.keystore ~/.android/debug.keystore
            echo "复用仓库里的 debug.keystore"
          else
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            cp ~/.android/debug.keystore _assets/debug.keystore
            git -C _assets config user.name github-actions
            git -C _assets config user.email actions@github.com
            git -C _assets add debug.keystore
            git -C _assets commit -m "ci: 固定 debug.keystore（首次构建自动生成）"
            git -C _assets push
            echo "已生成并提交 debug.keystore"
          fi

      - name: Put assets in place
        run: |
          set -e
          rm -rf audio video
          cp -r _assets/audio audio
          cp -r _assets/video video
          cp _assets/data/training_blocks.py data/training_blocks.py
          rm -rf _assets
          for p in data/training_blocks.py audio/durations.json "audio/sys/开始.mp3" video; do
            test -e "$p" || { echo "::error::资产里缺少 $p"; exit 1; }
          done
          python3 - <<'PY'
          import sys; sys.path.insert(0, '.')
          from data.training_blocks import TRAINING_BLOCKS
          n = sum(len(b.get('warmup', [])) + len(b['exercises']) + len(b.get('cooldown', [])) for b in TRAINING_BLOCKS.values())
          print(len(TRAINING_BLOCKS), '个训练块,', n, '个条目')
          PY
          du -sh audio video
          echo "code: $(git rev-parse --short HEAD)"

      - name: Set archs
        run: |
          sed -i "s/^android.archs = .*/android.archs = ${{ inputs.archs }}/" buildozer.spec
          grep -E '^(version|android.archs|requirements|services) ' buildozer.spec

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf libtool \
            libffi-dev libssl-dev libsqlite3-dev \
            python3-pip ccache
          pip install buildozer cython

      - name: Cache buildozer global (SDK / NDK)
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-

      - name: Accept Android SDK licenses and install build-tools
        run: |
          SDKMANAGER=$(find ~/.buildozer -name sdkmanager 2>/dev/null | head -1)
          if [ -n "$SDKMANAGER" ]; then
            yes 2>/dev/null | "$SDKMANAGER" --licenses || true
            "$SDKMANAGER" "build-tools;34.0.0" "platforms;android-33" || true
          fi

      - name: Build APK
        env:
          BUILDOZER_WARN_ON_ROOT: 0
        run: |
          set -o pipefail
          yes | buildozer android debug 2>&1 | tee build.log
          grep -E "^(Error|Traceback|# Build)" build.log || true

      - name: Name the APK
        run: |
          set -e
          sha=$(git rev-parse --short HEAD)
          for f in bin/*.apk; do
            mv "$f" "bin/subway_sport_${sha}_$(date +%Y%m%d).apk"
          done
          ls -la bin/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: subway-sport-apk
          path: bin/*.apk
          retention-days: 3        # 私有仓库 artifact 占免费存储额度（500 MB），APK 约 230 MB，下完就让它过期
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
